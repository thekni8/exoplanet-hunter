name: Autonomous Exoplanet Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Astrophysics Libraries
      run: pip install -r requirements.txt

    - name: Execute Deep Space Scan
      run: python scanner.py

   - name: Vault Results to Repository
      run: |
        git config --global user.name "Exoplanet Bot"
        git config --global user.email "actions@github.com"
        if [ -f hits.csv ]; then
          git add hits.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🎯 Logged new planet candidates" && git push)
        else
          echo "No planets found in this batch. Nothing to commit."
        fi
