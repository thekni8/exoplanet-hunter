# Golden validation suite — runs on every push and pull request.
#
# The suite (tests/run_golden.py --fast) proves the pipeline still
# works WITHOUT any network: recipe loader + persistence-stamp unit
# tests + Phase 1.1 hardening tests + the pipeline end to end on
# known objects against COMMITTED fixtures (TOI-700 c, WASP-126 b,
# and the known eclipsing binary TIC 308851365 — see
# tests/fixtures/golden/).
#
# The live MAST tests (test_golden_stars) do NOT run here: a MAST
# outage must never turn the PR gate red. They run on a weekly
# schedule instead (.github/workflows/live.yml), non-blocking.
#
# The lockfile-clean-install job proves requirements.lock
# installs from scratch with hash verification — a lockfile
# that only works in the dev venv is not a lockfile.
#
# A red run here is a real signal: do not "fix" it by loosening a
# threshold. Find what changed in the search, the stamp, or the data.
name: golden

on:
  push:
    branches: [main, standardize/**]
  pull_request:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The registry check diffs calibration/registry.json
          # against origin/main — it needs the full history.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check calibration registry (hashes + append-only)
        run: python scripts/check_registry.py --base origin/main

      - name: Flag expected-values / calibration changes
        # C-7: flags (never blocks) any change to the golden-star
        # acceptance numbers or to calibration/ vs the base
        # branch, with a plain-words summary + ::warning::
        # annotations. A changed expected value can be
        # legitimate — but it must never slip through unnoticed.
        run: python scripts/check_expected_values.py --base origin/main

      - name: Run golden suite (offline — no downloads)
        run: python tests/run_golden.py --fast

  lockfile-clean-install:
    # C-9: a clean-environment install from the lockfile, with
    # hash verification. Runs alongside the golden job on every
    # push/PR — a broken lockfile blocks the gate, because a run
    # nobody can reproduce is not a run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        # No pip cache here: this job proves PyPI serves the
        # pinned wheels, so it downloads them fresh.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean install from the lockfile
        run: |
          python -m venv .venv-lockfile-test
          .venv-lockfile-test/bin/pip install --upgrade pip
          .venv-lockfile-test/bin/pip install --require-hashes -r requirements.lock

      - name: Smoke test the clean install
        run: |
          .venv-lockfile-test/bin/python -c "import hunter, bulk_screen, provenance; print('imports OK')"
          .venv-lockfile-test/bin/python -m unittest tests.test_recipe tests.test_stamp
